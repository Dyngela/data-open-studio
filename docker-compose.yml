  # ── NATS (pipeline progress events → WebSocket hub) ────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: data-open-studio-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # HTTP monitoring
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Redis (caching / session store) ────────────────────────────────────────
  redis:
    image: redis:8.4-alpine
    container_name: data-open-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Gateway (CORS proxy → Rust API) ────────────────────────────────────────
  gateway:
    build:
      context: services/gateway
      dockerfile: Dockerfile
    container_name: data-open-studio-gateway
    restart: unless-stopped
    environment:
      API_URL:      http://host.docker.internal:8030
      GATEWAY_PORT: ":8000"
    ports:
      - "8000:8000"
