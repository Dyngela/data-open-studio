services:
  # ── Application database ────────────────────────────────────────────────────
  postgres:
    image: postgres:18
    container_name: data-open-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init/postgres-main:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ── Test database (sample data for development/testing) ────────────────────
  postgres-test:
    image: postgres:18
    container_name: data-open-studio-pg-test
    restart: unless-stopped
    environment:
      POSTGRES_USER:     testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB:       testdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
      - ./init/postgres-test:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 30s
      timeout: 5s
      retries: 5

